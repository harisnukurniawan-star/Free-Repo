name: Build Control Room

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: bash -n scripts/oci-private-bucket-prepare.sh && node --check scripts/verify-oci-storage.mjs && node --check scripts/verify-oci-native.mjs
      - run: npm test
      - run: npx eslint app/ai-room app/api/ai-room lib/ai-room-access.ts lib/ai-room-content-policy.ts lib/ai-room-jobs.ts lib/ai-room-private-auth.ts lib/ai-room-private-storage.ts lib/ai-room-native-objects.ts lib/ai-room-native-bridge.ts lib/video-engine.ts lib/wan-models.ts tests/ai-room-mature-mode.test.ts tests/ai-room-private-security.test.ts tests/ai-room-oci-native.test.ts app/api/ai-room/videos
      - run: npm run build
